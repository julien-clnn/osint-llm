name: Eval (real LLM)

# MANUAL trigger only (workflow_dispatch): unlike the test CI (ci.yml, auto
# on push/PR, no key), every run here really calls the LLM (--replay mode
# only replays tool results, not the provider — see docs/EVAL_PLAN.md and the
# evals/run_eval.py docstring) and therefore consumes real quota/budget. No
# automatic run on push/PR.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Suite to run"
        type: choice
        default: eval-quick
        options:
          - eval-quick        # subset (see domains), 1 repetition by default — the cheapest
          - eval              # full suite: 15 domains x repetitions x 2 configs, expensive
          - eval-adversarial  # prompt-injection suite (10 cases)
      domains:
        description: "Domains (space-separated) — only used by eval-quick"
        type: string
        default: "qapilot.com"
      repetitions:
        description: "Repetitions — only used by eval-quick"
        type: string
        default: "1"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements-dev.txt

      - name: Run ${{ inputs.target }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OSINTLLM_FIXTURE_MODE: replay
        run: |
          case "${{ inputs.target }}" in
            eval-quick)
              .venv/bin/python evals/run_eval.py --domains ${{ inputs.domains }} --repetitions ${{ inputs.repetitions }}
              ;;
            eval)
              .venv/bin/python evals/run_eval.py
              ;;
            eval-adversarial)
              .venv/bin/python evals/run_adversarial.py
              ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.target }}-${{ github.run_id }}
          path: |
            evals/results/
            evals/adversarial/results/
          if-no-files-found: ignore
