name: Demo (GitHub Pages)

# Builds the backend-less web demo (`make demo`: replays the analyses recorded
# in web/public-demo/, exports the eval runs) and publishes it on GitHub
# Pages. No API key and no LLM call: the export only reads committed files.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Export the demo data (eval runs, settings)
        run: .venv/bin/python scripts/demo_data.py export

      - name: Build the demo
        run: npm run build:demo
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
